name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
      - arena-dev
  workflow_dispatch:
    inputs:
      use_pngquant:
        description: 'Lossy PNG compression with pngquant (before lossless optipng pass)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJSON(github.ref == 'refs/heads/main' && '["main"]' || '["dev", "arena-dev"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22.x'

      - name: Install image optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng pngquant

      - name: Optimize PNGs in public/assets (lossy with pngquant)
        if: github.event_name != 'workflow_dispatch' || inputs.use_pngquant
        run: |
          echo "Optimizing PNGs in public/assets (lossy with pngquant)"
          find public/assets -type f -iname '*.png' -print0 | xargs -0 -n1 -P4 \
            pngquant \
              --quality=75-100 \
              --speed 1 \
              --skip-if-larger \
              --ext .png \
              --force \
              || true

      - name: Optimize PNGs in public/assets (lossless with optipng)
        run: |
          echo "Optimizing PNGs in public/assets (lossless with optipng)"
          find public/assets -type f -iname '*.png' -print0 | xargs -0 -n1 -P4 optipng -o7 -strip all || true

      - name: Install dependencies for CI
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build-nolog

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: game-build-${{ matrix.branch }}
          path: dist/

  deploy_itch:
    environment:
      name: itchio
      url: https://${{ vars.ITCH_USER }}.itch.io/${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: game-build-main
          path: dist/

      - name: Upload to itch.io
        uses: rthery/butler-publish-itchio-action@v1.1.1
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ github.event.repository.name }}
          ITCH_USER: surmoi
          PACKAGE: dist/

  deploy_itch_final_orbit:
    environment:
      name: itchio
      url: https://surmoi.itch.io/final-orbit
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/arena-dev'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: game-build-arena-dev
          path: dist/

      - name: Upload to itch.io
        uses: rthery/butler-publish-itchio-action@v1.1.1
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: final-orbit
          ITCH_USER: surmoi
          PACKAGE: dist/

  deploy_pages:
    permissions:
      contents: read
      pages: write
      id-token: write

    needs: build
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/arena-dev'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download shmup build
        uses: actions/download-artifact@v4.1.9
        with:
          name: game-build-dev
          path: dist/

      - name: Download arena build
        uses: actions/download-artifact@v4.1.9
        with:
          name: game-build-arena-dev
          path: dist/arena/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4